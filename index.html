<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Undangan Digital</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f6f4f8;--card:#fff;--ink:#1b1a33;--soft:#5d5b78;--line:#d9d5e6;--acc:#c2255c;--onacc:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#13122a;--card:#1c1b3a;--ink:#f1effa;--soft:#aeabcc;--line:#33315c;--acc:#ff7aa8;--onacc:#1b1a33}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:560px;margin:0 auto;padding:20px 18px 60px}
h1{font:700 1.6rem/1.2 Georgia,serif;margin:0 0 6px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:16px}
legend{font-weight:600;margin-bottom:8px;padding:0}fieldset{border:0;padding:0;margin:0 0 18px}
label{display:block;font-size:.88rem;color:var(--soft);margin:10px 0 4px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:70px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:600 1rem system-ui;background:var(--acc);color:var(--onacc);border:2px solid var(--acc);border-radius:12px;padding:12px 20px;cursor:pointer}
.btn.o{background:transparent;color:var(--ink);border-color:var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.msg{min-height:1.4em;margin-top:10px;font-size:.9rem;color:var(--soft)}
.link{word-break:break-all;font-family:ui-monospace,monospace;font-size:.85rem}
.sw{display:flex;gap:10px}.sw button{flex:1;height:44px;border-radius:10px;border:2px solid var(--line);cursor:pointer;font:600 .85rem system-ui}
.sw button[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hide{display:none!important}
.gr{border-top:1px solid var(--line);padding:12px 0}
.gr:first-child{border-top:0}
.gr b{display:block}.gr small{color:var(--soft)}
.bd{display:inline-block;font-size:.78rem;font-weight:600;border-radius:99px;padding:2px 10px;background:var(--bg);border:1px solid var(--line);margin-left:6px}
.sm{font:600 .85rem system-ui;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;text-decoration:none;display:inline-block}
.sm.d{color:#b3261e}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.sum div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.sum b{display:block;font-size:1.3rem}
.inv input,.inv textarea,.inv select{background:transparent;color:inherit;border:1px solid currentColor;font-family:sans-serif;margin-bottom:10px;opacity:.9}
.pbtn{font:600 .95rem sans-serif;border:0;border-radius:99px;padding:12px 24px;cursor:pointer;margin:4px}
.ws{max-width:480px;width:100%;text-align:left;margin-top:18px}
.ws div{border-top:1px solid currentColor;padding:10px 0;font:.92rem/1.5 sans-serif}
.ws div b{display:block}
.xt{max-width:480px;width:100%}
/* undangan publik */
.inv{margin:0;font-family:Georgia,serif}
.s{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center}
.k{font:600 .75rem sans-serif;letter-spacing:.2em;margin:0 0 14px}
.n{font-size:clamp(2.6rem,12vw,4.5rem);font-style:italic;line-height:1.05;margin:0}.n i{display:block;font-size:1.5rem;margin:6px 0}
.d{font:.85rem sans-serif;letter-spacing:.2em;margin-top:20px}
.q{font-style:italic;font-size:1.2rem;line-height:1.6;max-width:480px;margin:0}
.h{font-size:1.7rem;font-style:italic;margin:4px 0}.p{font:.9rem/1.5 sans-serif;opacity:.8;margin:0 0 22px}
.e{margin-bottom:22px}.e h3{font-size:1.5rem;margin:0}.e .t{font:600 .9rem sans-serif;margin:4px 0}.e p{font:.95rem sans-serif;margin:0;opacity:.85}
.m{font:.9rem sans-serif;text-decoration:none;border-bottom:1px solid}
</style>
</head>
<body>
<div id="app" class="w"><p>Memuat...</p></div>
<script>
// ====== ISI DUA BARIS INI (Supabase: Project Settings > API) ======
var SUPABASE_URL='https://zqmdimzvcdmjeadkfpcy.supabase.co';
var SUPABASE_ANON_KEY='sb_publishable_nSUkwTNDq4LCvTANEZpGjA_O66CNBwr';
// =================================================================
var T={zamrud:{bg:'#0f2421',ink:'#f1e6cf',acc:'#d3ae62',bg2:'#163330'},
       blush:{bg:'#f2d7d5',ink:'#4a1f2e',acc:'#9c3b57',bg2:'#ecc4c1'},
       langit:{bg:'#dfe8f5',ink:'#1f2f5c',acc:'#3b5fb0',bg2:'#cddcef'}};
var $=function(i){return document.getElementById(i)};
var app=$('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function wib(iso){var d=new Date(new Date(iso).getTime()+7*36e5);
  return {tgl:d.getUTCDate()+' '+BLN[d.getUTCMonth()]+' '+d.getUTCFullYear(),
          jam:('0'+d.getUTCHours()).slice(-2)+':'+('0'+d.getUTCMinutes()).slice(-2),
          date:d.toISOString().slice(0,10)}}
function slugify(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60)}

if(SUPABASE_URL.indexOf('GANTI')===0){
  app.innerHTML='<h1>Belum disambungkan</h1><p>Buka file ini dengan editor teks, lalu isi <b>SUPABASE_URL</b> dan <b>SUPABASE_ANON_KEY</b> di bagian atas skrip.</p>';
} else { start() }

function start(){
  var sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  var slugParam=new URLSearchParams(location.search).get('u');
  if(slugParam){publicView(sb,slugParam)}else{adminView(sb)}
}

/* ---------- Halaman publik ---------- */
async function publicView(sb,slug){
  var r=await sb.from('invitations').select('*, events(*)').eq('slug',slug).maybeSingle();
  if(r.error||!r.data){app.innerHTML='<h1>Undangan tidak ditemukan</h1><p>Linknya salah, atau undangan belum diaktifkan.</p>';return}
  var v=r.data,c=T[(v.theme_config&&v.theme_config.palette)||'zamrud']||T.zamrud;
  var ev=(v.events||[]).sort(function(a,b){return a.sort_order-b.sort_order});
  document.title='Undangan '+v.groom_name+' & '+v.bride_name;
  document.body.className='inv';document.body.style.cssText='background:'+c.bg+';color:'+c.ink;
  app.className='';app.style.cssText='padding:0;max-width:none';
  var first=ev[0]?wib(ev[0].starts_at).tgl.toUpperCase():'';
  var evh=ev.map(function(e){var w=wib(e.starts_at);
    return '<div class="e"><h3>'+esc(e.name)+'</h3><p class="t" style="color:'+c.acc+'">'+w.tgl+', '+w.jam+' WIB</p><p>'+esc(e.venue_name)+'</p>'+
    (/^https?:\/\//.test(e.map_url||'')?'<p><a class="m" style="color:'+c.ink+';border-color:'+c.acc+'" href="'+esc(e.map_url)+'" target="_blank" rel="noopener">Lihat lokasi di peta</a></p>':'')+'</div>'}).join('');
  app.innerHTML=
   '<section class="s"><p class="k" style="color:'+c.acc+'">PERNIKAHAN</p><h1 class="n">'+esc(v.groom_name)+'<i style="color:'+c.acc+'">&amp;</i>'+esc(v.bride_name)+'</h1><p class="d">'+first+'</p><p class="p" id="kpd" style="margin-top:22px"></p></section>'+
   (v.quote?'<section class="s" style="background:'+c.bg2+'"><p class="q">“'+esc(v.quote)+'”</p></section>':'')+
   '<section class="s"><p class="k" style="color:'+c.acc+'">MEMPELAI</p><h2 class="h">'+esc(v.groom_name)+'</h2><p class="p">'+esc(v.groom_parents)+'</p><h2 class="h">'+esc(v.bride_name)+'</h2><p class="p">'+esc(v.bride_parents)+'</p></section>'+
   '<section class="s" style="background:'+c.bg2+'">'+evh+'</section>'+
   '<section class="s" id="extra"><div class="xt"></div></section>';
  publicExtras(sb,v,c);
}

async function publicExtras(sb,v,c){
  var code=new URLSearchParams(location.search).get('to'),guest=null;
  if(code){
    var g=await sb.rpc('get_guest',{p_slug:v.slug,p_code:code});
    if(!g.error&&g.data&&g.data.length){guest=g.data[0]}
    else{
      // Bukan kode tamu terdaftar: pakai langsung sebagai nama tamu (?to=Budi+Santoso)
      var nm=code.trim().slice(0,80);
      if(nm){guest={guest_name:nm,guest_pax:5,status:'pending',confirmed_pax:0,byName:true};code=null}
    }
    if(guest){var k=$('kpd');if(k)k.innerHTML='Kepada Yth.<br><b>'+esc(guest.guest_name)+'</b>'}
  }
  var btn='background:'+c.acc+';color:'+c.bg;
  var h='';
  if(guest){
    var st=guest.status==='attending'?'Kamu tercatat hadir ('+guest.confirmed_pax+' orang).':guest.status==='declined'?'Kamu tercatat tidak hadir.':'';
    var opts='';for(var i=1;i<=guest.guest_pax;i++)opts+='<option value="'+i+'">'+i+' orang</option>';
    h+='<h2 class="h">Konfirmasi kehadiran</h2><p class="p" id="rs">'+st+'</p>'+
       (guest.guest_pax>1?'<select id="rp" aria-label="Jumlah orang">'+opts+'</select>':'')+
       '<div><button class="pbtn" id="ry" style="'+btn+'">Saya hadir</button><button class="pbtn" id="rn" style="background:transparent;color:inherit;border:1px solid currentColor">Tidak bisa hadir</button></div>';
  }
  h+='<h2 class="h" style="margin-top:34px">Ucapan dan doa</h2>'+
     '<input id="wn" placeholder="Nama" maxlength="60" value="'+esc(guest?guest.guest_name:'')+'" '+(guest?'readonly':'')+'>'+
     '<textarea id="wm" placeholder="Tulis ucapan" maxlength="500" style="min-height:80px"></textarea>'+
     '<button class="pbtn" id="wk" style="'+btn+'">Kirim ucapan</button><p class="p" id="wmsg" role="status"></p><div class="ws" id="wl"></div>';
  document.querySelector('#extra .xt').innerHTML=h;

  async function loadW(){
    var r=await sb.from('wishes').select('author_name,message,created_at').eq('invitation_id',v.id).eq('is_hidden',false).order('created_at',{ascending:false}).limit(50);
    $('wl').innerHTML=(r.data||[]).map(function(w){return '<div><b>'+esc(w.author_name)+'</b>'+esc(w.message)+'</div>'}).join('');
  }
  async function rsvp(s){
    var p=$('rp')?+$('rp').value:1;
    var r=guest.byName
      ?await sb.rpc('submit_rsvp_name',{p_slug:v.slug,p_name:guest.guest_name,p_status:s,p_pax:p})
      :await sb.rpc('submit_rsvp',{p_slug:v.slug,p_code:code,p_status:s,p_pax:p});
    $('rs').textContent=r.error?'Gagal mengirim. Coba lagi.':(s==='attending'?'Terima kasih, kehadiranmu tercatat.':'Terima kasih sudah memberi tahu.');
  }
  if(guest){$('ry').onclick=function(){rsvp('attending')};$('rn').onclick=function(){rsvp('declined')}}
  $('wk').onclick=async function(){
    var n=$('wn').value.trim(),m=$('wm').value.trim();
    if(!n||!m){$('wmsg').textContent='Isi nama dan ucapan dulu.';return}
    var r=await sb.rpc('submit_wish',{p_slug:v.slug,p_code:code,p_name:n,p_message:m});
    if(r.error){$('wmsg').textContent='Gagal mengirim. Coba lagi.';return}
    $('wm').value='';$('wmsg').textContent='Terima kasih atas ucapannya.';loadW();
  };
  loadW();
}

/* ---------- Dashboard pemilik ---------- */
function adminView(sb){
  var user=null,inv=null,palette='zamrud',themeId=null;
  function say(t){var m=$('msg');if(m)m.textContent=t}

  async function init(){
    var s=await sb.auth.getSession();user=s.data.session?s.data.session.user:null;
    user?await editor():authForm();
  }
  function authForm(){
    app.innerHTML='<h1>Undangan digital</h1><p>Masuk atau daftar untuk membuat undanganmu.</p>'+
    '<div class="panel"><label for="em">Email</label><input id="em" type="email" autocomplete="email">'+
    '<label for="pw">Kata sandi (min. 6 karakter)</label><input id="pw" type="password" autocomplete="current-password">'+
    '<div class="row"><button class="btn" id="in">Masuk</button><button class="btn o" id="up">Daftar</button></div><p class="msg" id="msg" role="status"></p></div>';
    $('in').onclick=async function(){var r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
      r.error?say('Gagal masuk: '+r.error.message):init()};
    $('up').onclick=async function(){var r=await sb.auth.signUp({email:$('em').value.trim(),password:$('pw').value});
      if(r.error){say('Gagal daftar: '+r.error.message)}
      else if(r.data.session){init()}else{say('Cek email untuk konfirmasi, lalu masuk.')}};
  }
  async function editor(){
    var th=await sb.from('themes').select('id').eq('code','zamrud').single();themeId=th.data&&th.data.id;
    var r=await sb.from('invitations').select('*, events(*)').eq('owner_id',user.id).order('created_at').limit(1).maybeSingle();
    inv=r.data;
    var ev=inv?(inv.events||[]).sort(function(a,b){return a.sort_order-b.sort_order}):[];
    var ak=ev[0]?wib(ev[0].starts_at):{date:'',jam:''},rs=ev[1]?wib(ev[1].starts_at):{date:'',jam:''};
    palette=(inv&&inv.theme_config&&inv.theme_config.palette)||'zamrud';
    var g=function(o,k){return esc(o&&o[k]||'')};
    app.innerHTML='<h1>Editor undangan</h1><p>Masuk sebagai '+esc(user.email)+' · <a href="#" id="out">Keluar</a></p><div class="panel">'+
    '<fieldset><legend>Mempelai</legend><div class="two"><div><label for="gn">Nama pria</label><input id="gn" value="'+g(inv,'groom_name')+'"></div><div><label for="bn">Nama wanita</label><input id="bn" value="'+g(inv,'bride_name')+'"></div></div>'+
    '<label for="gp">Orang tua pria</label><input id="gp" value="'+g(inv,'groom_parents')+'"><label for="bp">Orang tua wanita</label><input id="bp" value="'+g(inv,'bride_parents')+'"></fieldset>'+
    '<fieldset><legend>Akad</legend><div class="two"><div><label for="ad">Tanggal</label><input id="ad" type="date" value="'+ak.date+'"></div><div><label for="at">Jam (WIB)</label><input id="at" type="time" value="'+ak.jam+'"></div></div><label for="av">Lokasi</label><input id="av" value="'+g(ev[0],'venue_name')+'"></fieldset>'+
    '<fieldset><legend>Resepsi</legend><div class="two"><div><label for="rd">Tanggal</label><input id="rd" type="date" value="'+rs.date+'"></div><div><label for="rt">Jam (WIB)</label><input id="rt" type="time" value="'+rs.jam+'"></div></div><label for="rv">Lokasi</label><input id="rv" value="'+g(ev[1],'venue_name')+'"><label for="mp">Link Google Maps (opsional)</label><input id="mp" value="'+g(ev[1],'map_url')+'"></fieldset>'+
    '<fieldset><legend>Tampilan</legend><label for="qt">Kutipan</label><textarea id="qt">'+g(inv,'quote')+'</textarea><label>Warna tema</label><div class="sw" id="sw">'+
    Object.keys(T).map(function(k){return '<button type="button" data-t="'+k+'" style="background:'+T[k].bg+';color:'+T[k].ink+'" aria-pressed="'+(k===palette)+'">'+k+'</button>'}).join('')+'</div></fieldset>'+
    '<fieldset><legend>Alamat undangan</legend><label for="sl">Slug</label><input id="sl" value="'+g(inv,'slug')+'" autocapitalize="none"></fieldset>'+
    '<div class="row"><button class="btn" id="sv">Simpan</button><button class="btn o" id="pb">'+(inv&&inv.status==='active'?'Nonaktifkan':'Aktifkan undangan')+'</button></div>'+
    '<p class="msg" id="msg" role="status"></p><p class="link" id="lk"></p></div>'+
    '<div class="panel" id="gp"></div><div class="panel" id="wp"></div>';
    showLink();guestsPanel();
    $('out').onclick=async function(e){e.preventDefault();await sb.auth.signOut();authForm()};
    $('sw').onclick=function(e){var b=e.target.closest('button');if(!b)return;palette=b.dataset.t;
      document.querySelectorAll('#sw button').forEach(function(x){x.setAttribute('aria-pressed',x===b)})};
    $('sv').onclick=save;$('pb').onclick=toggle;
  }
  function showLink(){
    var l=$('lk');if(!inv){l.textContent='';return}
    var u=location.origin+location.pathname+'?u='+inv.slug;
    l.innerHTML=(inv.status==='active'?'Link undangan: ':'Draf (belum aktif). Link nanti: ')+'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u)+'</a>';
  }
  function iso(d,t){return d&&t?d+'T'+t+':00+07:00':null}
  async function save(){
    var v=function(i){return $(i).value.trim()};
    if(!v('gn')||!v('bn')){say('Isi nama kedua mempelai.');return}
    var slug=slugify(v('sl')||v('gn')+' '+v('bn'));
    if(slug.length<3){say('Slug minimal 3 huruf atau angka.');return}
    var a=iso(v('ad'),v('at')),b=iso(v('rd'),v('rt'));
    if(!a){say('Isi tanggal dan jam akad.');return}
    say('Menyimpan...');
    var row={owner_id:user.id,theme_id:themeId,slug:slug,groom_name:v('gn'),bride_name:v('bn'),groom_parents:v('gp'),bride_parents:v('bp'),quote:v('qt'),theme_config:{palette:palette}};
    var r=inv?await sb.from('invitations').update(row).eq('id',inv.id).select().single():await sb.from('invitations').insert(row).select().single();
    if(r.error){say(r.error.code==='23505'?'Slug sudah dipakai, coba yang lain.':'Gagal menyimpan: '+r.error.message);return}
    inv=r.data;
    await sb.from('events').delete().eq('invitation_id',inv.id);
    var evs=[{invitation_id:inv.id,name:'Akad nikah',starts_at:a,venue_name:v('av'),sort_order:0}];
    if(b)evs.push({invitation_id:inv.id,name:'Resepsi',starts_at:b,venue_name:v('rv'),map_url:v('mp')||null,sort_order:1});
    var e=await sb.from('events').insert(evs);
    $('sl').value=slug;showLink();guestsPanel();
    say(e.error?'Data acara gagal disimpan: '+e.error.message:'Tersimpan.');
  }
  async function toggle(){
    if(!inv){say('Simpan dulu sebelum mengaktifkan.');return}
    var on=inv.status!=='active';
    var r=await sb.from('invitations').update({status:on?'active':'draft',published_at:on?new Date().toISOString():inv.published_at}).eq('id',inv.id).select().single();
    if(r.error){say('Gagal: '+r.error.message);return}
    inv=r.data;$('pb').textContent=on?'Nonaktifkan':'Aktifkan undangan';showLink();say(on?'Undangan aktif.':'Undangan dinonaktifkan.');
  }
  function base(){return location.origin+location.pathname}
  function phone62(p){p=String(p||'').replace(/[^0-9]/g,'');if(p.indexOf('0')===0)p='62'+p.slice(1);return p}
  function guestLink(g){return base()+'?u='+inv.slug+'&to='+g.code}
  function waText(g){return 'Assalamualaikum, '+g.name+'. Kami mengundang Anda ke pernikahan '+inv.groom_name+' & '+inv.bride_name+'. Buka undangan di sini: '+guestLink(g)}

  async function guestsPanel(){
    var gp=$('gp'),wp=$('wp');if(!gp)return;
    if(!inv){gp.innerHTML='';wp.innerHTML='';return}
    gp.innerHTML='<h1 style="font-size:1.3rem">Link per nama tamu</h1><p class="msg">Tidak perlu mendaftarkan tamu dulu. Ketik nama, lalu salin atau kirim linknya. Nama otomatis tampil di undangan.</p>'+
      '<label for="qn">Nama tamu</label><input id="qn" placeholder="Budi Santoso" maxlength="80">'+
      '<div class="row"><button class="btn" id="qc">Salin link</button><button class="btn o" id="qw">Kirim lewat WA</button></div>'+
      '<p class="link" id="ql"></p>'+
      '<hr style="border:0;border-top:1px solid var(--line);margin:22px 0">'+
      '<h1 style="font-size:1.3rem">Daftar tamu (opsional)</h1><p class="msg">Satu tamu per baris. Format: <b>Nama, nomor WhatsApp</b> (nomor boleh dikosongkan).</p>'+
      '<textarea id="gl" placeholder="Budi Santoso, 081234567890&#10;Keluarga Ibu Rini"></textarea>'+
      '<label for="gx">Jumlah orang per tamu</label><input id="gx" type="number" min="1" max="10" value="1">'+
      '<div class="row"><button class="btn" id="ga">Tambah tamu</button></div><p class="msg" id="gm" role="status"></p>'+
      '<div class="sum" id="gs"></div><div id="gr"></div>';
    $('ga').onclick=addGuests;
    function nameLink(){var n=$('qn').value.trim();return n?base()+'?u='+inv.slug+'&to='+encodeURIComponent(n):''}
    $('qn').oninput=function(){var u=nameLink();$('ql').textContent=u};
    $('qc').onclick=async function(){
      var u=nameLink();if(!u){$('ql').textContent='Ketik nama tamu dulu.';return}
      $('ql').textContent=u;
      try{await navigator.clipboard.writeText(u);$('qc').textContent='Tersalin'}catch(x){window.prompt('Salin link ini:',u)}
      setTimeout(function(){$('qc').textContent='Salin link'},2000);
    };
    $('qw').onclick=function(){
      var u=nameLink(),n=$('qn').value.trim();if(!u){$('ql').textContent='Ketik nama tamu dulu.';return}
      var t='Assalamualaikum, '+n+'. Kami mengundang Anda ke pernikahan '+inv.groom_name+' & '+inv.bride_name+'. Buka undangan di sini: '+u;
      window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank','noopener');
    };
    await loadGuests();loadWishes();
  }
  async function addGuests(){
    var lines=$('gl').value.split('\n').map(function(x){return x.trim()}).filter(Boolean);
    if(!lines.length){$('gm').textContent='Isi minimal satu nama.';return}
    var pax=Math.max(1,Math.min(10,+$('gx').value||1));
    var rows=lines.map(function(l){var p=l.split(',');return {invitation_id:inv.id,name:p[0].trim().slice(0,80),phone:(p[1]||'').trim()||null,pax:pax}}).filter(function(r){return r.name});
    var r=await sb.from('guests').insert(rows);
    if(r.error){$('gm').textContent='Gagal menambah: '+r.error.message;return}
    $('gl').value='';$('gm').textContent=rows.length+' tamu ditambahkan.';loadGuests();
  }
  async function loadGuests(){
    var r=await sb.from('guests').select('*').eq('invitation_id',inv.id).order('created_at');
    var gs=r.data||[],hadir=0,tidak=0,belum=0;
    gs.forEach(function(g){if(g.rsvp_status==='attending')hadir+=g.rsvp_pax||0;else if(g.rsvp_status==='declined')tidak++;else belum++});
    $('gs').innerHTML='<div><b>'+hadir+'</b>orang hadir</div><div><b>'+tidak+'</b>tidak hadir</div><div><b>'+belum+'</b>belum jawab</div>';
    $('gr').innerHTML=gs.length?gs.map(function(g){
      var s=g.rsvp_status==='attending'?'Hadir':g.rsvp_status==='declined'?'Tidak hadir':'Belum jawab';
      var wa=g.phone?'<a class="sm" target="_blank" rel="noopener" href="https://wa.me/'+phone62(g.phone)+'?text='+encodeURIComponent(waText(g))+'">Kirim WA</a> ':'';
      return '<div class="gr"><b>'+esc(g.name)+'<span class="bd">'+s+'</span></b><small>'+g.pax+' orang'+(g.opened_at?' · sudah dibuka':'')+'</small><div class="row">'+wa+
        '<button class="sm" data-c="'+esc(g.code)+'" data-a="copy">Salin link</button><button class="sm d" data-i="'+g.id+'" data-a="del">Hapus</button></div></div>'}).join('')
      :'<p class="msg">Belum ada tamu.</p>';
    $('gr').onclick=async function(e){
      var b=e.target.closest('button');if(!b)return;
      if(b.dataset.a==='copy'){
        var u=base()+'?u='+inv.slug+'&to='+b.dataset.c;
        try{await navigator.clipboard.writeText(u);b.textContent='Tersalin'}catch(x){window.prompt('Salin link ini:',u)}
      }else if(b.dataset.a==='del'&&confirm('Hapus tamu ini?')){
        await sb.from('guests').delete().eq('id',b.dataset.i);loadGuests();
      }
    };
  }
  async function loadWishes(){
    var wp=$('wp');
    var r=await sb.from('wishes').select('*').eq('invitation_id',inv.id).order('created_at',{ascending:false});
    var ws=r.data||[];
    wp.innerHTML='<h1 style="font-size:1.3rem">Ucapan tamu ('+ws.length+')</h1>'+(ws.length?ws.map(function(w){
      return '<div class="gr"><b>'+esc(w.author_name)+(w.is_hidden?'<span class="bd">Disembunyikan</span>':'')+'</b><small>'+esc(w.message)+'</small><div class="row"><button class="sm" data-i="'+w.id+'" data-h="'+(w.is_hidden?'0':'1')+'">'+(w.is_hidden?'Tampilkan':'Sembunyikan')+'</button></div></div>'}).join(''):'<p class="msg">Belum ada ucapan.</p>');
    wp.onclick=async function(e){
      var b=e.target.closest('button');if(!b)return;
      await sb.from('wishes').update({is_hidden:b.dataset.h==='1'}).eq('id',b.dataset.i);loadWishes();
    };
  }
  init();
}
</script>
</body>
</html>
