<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Undangan Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f7f8fc;--card:#fff;--ink:#14213d;--soft:#5a6379;--line:#e2e6f0;--acc:#1b2a5c;--onacc:#fff;--gold:#b8862b;--tint:#eef1fa}
@media (prefers-color-scheme:dark){:root{--bg:#0d1325;--card:#151d38;--ink:#eef0f8;--soft:#a3abc4;--line:#273253;--acc:#e0b866;--onacc:#1b1405;--gold:#e0b866;--tint:#1b2442}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:560px;margin:0 auto;padding:20px 18px 60px}
h1{font:700 1.6rem/1.2 Georgia,serif;margin:0 0 6px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:16px}
legend{font-weight:600;margin-bottom:8px;padding:0}fieldset{border:0;padding:0;margin:0 0 18px}
label{display:block;font-size:.88rem;color:var(--soft);margin:10px 0 4px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:70px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:600 1rem system-ui;background:var(--acc);color:var(--onacc);border:2px solid var(--acc);border-radius:12px;padding:12px 20px;cursor:pointer}
.btn.o{background:transparent;color:var(--ink);border-color:var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.msg{min-height:1.4em;margin-top:10px;font-size:.9rem;color:var(--soft)}
.link{word-break:break-all;font-family:ui-monospace,monospace;font-size:.85rem}
.sw{display:flex;gap:10px}.sw button{flex:1;height:44px;border-radius:10px;border:2px solid var(--line);cursor:pointer;font:600 .85rem system-ui}
.sw button[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hide{display:none!important}
/* ===== Desain baru: beranda, katalog, login, dashboard ===== */
body:not(.inv){font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif}
body:not(.inv) h1,body:not(.inv) h2,body:not(.inv) h3{font-family:Fraunces,Georgia,serif}
input,textarea{border-radius:12px;padding:12px 14px}
input:focus,textarea:focus{border-color:var(--acc)}
a.btn{display:inline-block;text-align:center;text-decoration:none}
.btn{border-radius:12px;font-family:inherit}
.btn.big{padding:14px 26px;font-size:1rem}.btn.sm2{padding:9px 16px;font-size:.88rem;white-space:nowrap}
.wfull{display:block;width:100%}
.sm{font:600 .85rem 'Plus Jakarta Sans',system-ui;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-block}
.shi{max-width:1080px;margin:0 auto;padding:0 18px}
.sh{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sh .shi{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font:700 1.12rem Fraunces,Georgia,serif;color:var(--ink);text-decoration:none;white-space:nowrap}
.lg{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--acc);color:var(--onacc);font-size:.8rem}
.snav{display:none;gap:26px}.snav a{color:var(--soft);text-decoration:none;font-weight:500;font-size:.92rem}.snav a:hover{color:var(--ink)}
.sact{display:flex;align-items:center;gap:8px}
.lnk{color:var(--ink);font-weight:600;text-decoration:none;font-size:.92rem;padding:8px}
.mail{display:none;color:var(--soft);font-size:.85rem}
@media(min-width:760px){.snav{display:flex}}
@media(min-width:600px){.mail{display:inline}}
.hero{padding:40px 0 56px}
.hg{display:grid;gap:30px;align-items:center}
@media(min-width:860px){.hg{grid-template-columns:1.05fr .95fr}}
.chip{display:inline-block;background:var(--tint);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:.82rem;font-weight:600}
.hero h1{font-size:clamp(2.3rem,7vw,3.8rem);line-height:1.08;margin:16px 0 14px;letter-spacing:-.02em}
.hero h1 em{font-style:italic;color:var(--gold)}
.lead{color:var(--soft);font-size:1.06rem;max-width:520px;margin:0}
.ticks{list-style:none;display:flex;flex-wrap:wrap;gap:8px 18px;padding:0;margin:22px 0 0;color:var(--soft);font-size:.9rem}
.ticks li::before{content:"✓";color:var(--gold);font-weight:700;margin-right:6px}
.phones{position:relative;height:420px}
.phm{position:absolute;width:184px;aspect-ratio:9/18.5;border-radius:28px;border:6px solid #0f172a;overflow:hidden;box-shadow:0 24px 50px rgba(15,23,42,.28)}
.phm.p1{left:calc(50% - 176px);top:34px;transform:rotate(-6deg)}
.phm.p2{left:calc(50% - 8px);top:0;transform:rotate(5deg)}
.phs{position:absolute;left:0;right:0;bottom:0}.phs svg{width:100%;display:block}
.pht{position:absolute;top:15%;left:0;right:0;text-align:center}
.pht small{display:block;font:700 .5rem sans-serif;letter-spacing:.16em;margin-bottom:8px}
.pht b{font:italic 400 1.45rem/1.1 Georgia,serif}
.sec{padding:60px 0}.sec.alt{background:var(--tint)}
.eyebrow{color:var(--gold);font-weight:700;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px}
.sec h2{font-size:clamp(1.7rem,4.5vw,2.4rem);line-height:1.15;margin:0;letter-spacing:-.01em}
.steps{display:grid;gap:14px;margin-top:28px}
@media(min-width:760px){.steps{grid-template-columns:repeat(3,1fr)}}
.stp{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.stp span{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--acc);color:var(--onacc);font-weight:700;margin-bottom:12px}
.stp h3{margin:0 0 6px;font-size:1.15rem}.stp p{margin:0;color:var(--soft);font-size:.94rem}
.fg{display:grid;gap:14px;margin-top:28px;grid-template-columns:1fr}
@media(min-width:620px){.fg{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.fg{grid-template-columns:repeat(3,1fr)}}
.fc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.fi{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--tint);color:var(--gold);font-size:1.2rem;font-weight:700;margin-bottom:12px}
.fc h3{margin:0 0 6px;font-size:1.1rem}.fc p{margin:0;color:var(--soft);font-size:.93rem}
.scroller{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 18px 18px;margin:22px -18px 0}
.scroller .tcard{flex:0 0 210px;scroll-snap-align:start}
.price{max-width:440px;margin:26px auto 0;background:var(--card);border:2px solid var(--gold);border-radius:22px;padding:28px}
.price .pn{font:700 2.2rem Fraunces,Georgia,serif}
.price ul{list-style:none;padding:0;margin:16px 0 22px;display:grid;gap:8px}
.price li::before{content:"✓";color:var(--gold);font-weight:700;margin-right:8px}
.faq details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:10px}
.faq summary{cursor:pointer;font-weight:600;list-style:none}.faq summary::-webkit-details-marker{display:none}
.faq p{color:var(--soft);margin:10px 0 0;font-size:.94rem}
.ctab{background:var(--acc);color:var(--onacc);border-radius:26px;padding:46px 24px;text-align:center}
.ctab h2{color:var(--onacc)}.ctab p{opacity:.85;margin:12px auto 22px;max-width:460px}
.ctab .btn{background:var(--onacc);color:var(--acc);border-color:var(--onacc)}
.sf{border-top:1px solid var(--line);padding:28px 0;color:var(--soft);font-size:.9rem}
.sf .shi{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
.sf a{color:var(--soft);text-decoration:none;margin-left:16px}
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:24px 0}
@media(min-width:900px){.tgrid{grid-template-columns:repeat(3,1fr)}}
.authw{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px;gap:18px}
.authc{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 18px 40px rgba(20,33,61,.08)}
.authc h1{font-size:1.5rem;margin:0 0 4px}.authc p.sub{color:var(--soft);margin:0 0 14px;font-size:.92rem}
.seg,.seg3{display:grid;background:var(--tint);border-radius:12px;padding:4px;gap:4px}
.seg{grid-template-columns:1fr 1fr;margin-bottom:18px}.seg3{grid-template-columns:repeat(3,1fr);margin:14px 0}
.seg button,.seg3 button{border:0;background:transparent;color:var(--soft);font:600 .92rem 'Plus Jakarta Sans',system-ui;padding:10px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"],.seg3 button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.authw p.msg a,.msg a{color:var(--soft)}
.dw{max-width:620px;margin:0 auto;padding:16px 16px 120px}
.lcard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:16px;padding:16px 18px}
.lstat{font-size:.92rem;color:var(--soft)}
.lcard .link{margin:8px 0 2px;color:var(--ink)}
.bd.on{background:rgba(34,160,90,.14);color:#1f9d5a;border-color:rgba(34,160,90,.4);margin-left:0;margin-right:6px}
.bd.off{margin-left:0;margin-right:6px}
.acc{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.acc summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;cursor:pointer;list-style:none}
.acc summary::-webkit-details-marker{display:none}
.acc summary b{font-size:1rem}.acc summary small{color:var(--soft);display:block;font-size:.8rem;font-weight:400}
.acc summary::after{content:"⌄";color:var(--soft);font-size:1.2rem;transition:transform .2s}
.acc[open] summary::after{transform:rotate(180deg)}
.accb{padding:0 18px 18px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.savebar .btn{padding:11px 20px}.savebar .msg{margin:0;min-height:0;flex:1;min-width:120px;font-size:.82rem}
.vtag{text-align:center;font-size:.75rem;margin-top:18px}

.tpl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.tc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:inherit}
.tc[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.tc .tcs{width:100%;height:46px;border-radius:8px;display:grid;place-items:center;font-size:1.3rem}
.tc b{font-size:.85rem}.tc small{color:var(--soft);font-size:.72rem}
.demobar{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:80;background:rgba(0,0,0,.55);color:#fff;border-radius:99px;padding:8px 14px;font:600 .8rem sans-serif;text-decoration:none;backdrop-filter:blur(6px)}
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:18px 0}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.th{aspect-ratio:3/4;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.th b{align-self:center;font:italic 700 1.6rem Georgia,serif}
.ths{width:100%}.ths svg{width:100%;display:block}
.tb{padding:12px 14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.tb h2{font:700 1.1rem Georgia,serif;margin:2px 0 0}
.tb p{color:var(--soft);font-size:.82rem;margin:0 0 8px;flex:1}
.tb .btn{text-align:center;padding:10px 12px;font-size:.9rem;text-decoration:none}

/* ===== Undangan: sampul, musik, animasi ===== */
body.locked{overflow:hidden}
.door{position:fixed;top:0;bottom:0;width:50%;background:var(--b);z-index:50;transition:transform 1.5s cubic-bezier(.77,0,.18,1);display:flex;align-items:center}
.door.l{left:0;justify-content:flex-end;border-right:1px solid var(--a)}
.door.r{right:0;justify-content:flex-start;border-left:1px solid var(--a)}
.door span{font:italic 400 clamp(4.5rem,24vw,11rem)/1 Georgia,serif;color:var(--a);padding:0 .08em}
.door.l span{padding-right:.12em}.door.r span{padding-left:.12em}
.cover{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:24px 24px 14vh;color:var(--i);transition:opacity .6s ease;pointer-events:none}
.cover>*{pointer-events:auto}
.cover small{font:600 .8rem sans-serif;letter-spacing:.2em;color:var(--a)}
.cn{font:italic 400 2.1rem/1.1 Georgia,serif;margin:.3em 0 .4em}
.cg{font:1rem/1.5 sans-serif;min-height:3em;margin:0 0 .8em}
body.open .door.l{transform:translateX(-101%)}
body.open .door.r{transform:translateX(101%)}
body.open .cover{opacity:0}
body.open .cover>*{pointer-events:none}
body.done .door,body.done .cover{display:none}
.inv .s{position:relative;isolation:isolate;overflow:hidden}
.inv .s::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--b);clip-path:circle(0% at 50% 55%);transition:clip-path 1.3s cubic-bezier(.65,0,.2,1)}
.inv .s:nth-of-type(even)::before{background:var(--b2)}
.inv .s.in::before{clip-path:circle(150% at 50% 55%)}
.inv .s>*{opacity:0;transform:translateY(26px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.inv .s.in>*{opacity:1;transform:none}
.inv .s.in>*:nth-child(2){transition-delay:.35s}.inv .s.in>*:nth-child(3){transition-delay:.5s}
.inv .s.in>*:nth-child(4){transition-delay:.65s}.inv .s.in>*:nth-child(5){transition-delay:.8s}
.inv .k,.inv .e .t,.inv .n i{color:var(--a)}
.inv .m{color:inherit;border-color:var(--a)}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:420px;margin-top:20px}
.cd div{border:1px solid var(--a);padding:14px 4px}
.cd b{display:block;font:400 2rem/1 Georgia,serif;font-variant-numeric:tabular-nums}
.cd i{font:normal .7rem sans-serif;letter-spacing:.1em;opacity:.8}
.gift{max-width:420px;width:100%;border:1px solid var(--a);padding:20px;margin:6px 0 18px;font-family:sans-serif}
.story{max-width:480px;font:1.05rem/1.8 Georgia,serif;white-space:pre-line;margin:0}
.mus{position:fixed;right:16px;bottom:16px;z-index:70;width:46px;height:46px;border-radius:50%;border:1px solid var(--a);background:var(--b);color:var(--a);font:1.4rem/1 Georgia,serif;cursor:pointer;display:none;align-items:center;justify-content:center;overflow:hidden}
body.open .mus{display:flex}
.mus.off::after{content:"";position:absolute;width:60%;height:2px;background:var(--a);transform:rotate(-45deg)}
.inv.eth .door{background-color:var(--dc);background-image:var(--doorbg);background-size:200% 100%;border:0}
.inv.eth .door.l{background-position:left center}
.inv.eth .door.r{background-position:right center}
.inv.eth .door{align-items:flex-start;padding-top:8vh}
.inv.eth .cover{color:var(--ctext)}
.inv.eth .cover small{color:var(--ckick);font-weight:700}
.inv.eth #ob{background:var(--btnbg)!important;color:var(--btntext)!important}
.inv.eth .door svg{width:100%;height:min(52vh,110vw);max-height:520px;display:block}
.inv.eth .s::before{background-image:var(--pat)}
.inv.eth #hero{justify-content:flex-start;padding-top:12vh}
.inv.eth #hero::before{background:var(--herobg)}
.bor{position:absolute;left:0;right:0;bottom:0;z-index:-1;pointer-events:none;display:flex;justify-content:center}
.bor svg{width:100%;max-width:680px;height:auto;display:block;overflow:visible}
.inv .s>.bor{transform:translateY(70px)}
.inv .s.in>.bor{transform:none;transition-duration:2s}
.inv.eth .door{width:50.3%;transform:perspective(1400px) rotateY(0deg);backface-visibility:hidden}
.inv.eth .door.l{transform-origin:0 50%}
.inv.eth .door.r{transform-origin:100% 50%}
body.open.eth .door.l{transform:perspective(1400px) rotateY(-100deg)}
body.open.eth .door.r{transform:perspective(1400px) rotateY(100deg)}
.inv.eth .gimg{position:absolute;top:5vh;height:min(52vh,112vw);width:auto;max-width:none;filter:drop-shadow(0 16px 24px rgba(40,18,4,.6))}
.inv.eth .door.l .gimg{right:0;transform:translateX(50%)}
.inv.eth .door.r .gimg{left:0;transform:translateX(-50%)}
.bor.bph{top:0}
.bor.bph img{width:100%;height:100%;object-fit:cover;object-position:center bottom;display:block}
.bor.bph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,10,5,.8) 0%,rgba(20,10,5,.3) 48%,rgba(20,10,5,.05) 100%)}
.inv .s>.bor.bph{transform:none}
.inv .s.in .bph img{animation:kb 20s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12)}}
.wy{height:min(26vh,210px);width:auto;max-width:70%;filter:drop-shadow(0 10px 16px rgba(0,0,0,.55));margin-bottom:6px;transform-origin:50% 100%}
.inv .s.in>.wy{animation:sway 5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.cvimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;z-index:-2;pointer-events:none;transform:scale(1);transition:transform 2.6s cubic-bezier(.2,.7,.2,1)}
.covimg .cover::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(0deg,rgba(20,10,5,.88) 0%,rgba(20,10,5,.6) 32%,rgba(20,10,5,0) 62%)}
.inv.eth.covimg .cover{color:#f6e7c8;transition:opacity 1.8s ease .25s}
.inv.eth.covimg .cover small{color:#e8bb63}
.inv.eth.covimg #ob{background:#d9a441!important;color:#2a1508!important}
.covimg .cover>*:not(.cvimg){transition:opacity .5s ease}
body.open.covimg .cover>*:not(.cvimg){opacity:0}
body.open.covimg .cover .cvimg{transform:scale(1.35)}
@media (prefers-reduced-motion:reduce){.inv .s.in .bph img,.inv .s.in>.wy,.cvimg{animation:none!important;transition-duration:.01s!important}}
@media (prefers-reduced-motion:reduce){.door,.cover,.inv .s::before,.inv .s>*{transition-duration:.01s!important;transition-delay:0s!important}}

.gr{border-top:1px solid var(--line);padding:12px 0}
.gr:first-child{border-top:0}
.gr b{display:block}.gr small{color:var(--soft)}
.bd{display:inline-block;font-size:.78rem;font-weight:600;border-radius:99px;padding:2px 10px;background:var(--bg);border:1px solid var(--line);margin-left:6px}
.sm{font:600 .85rem system-ui;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;text-decoration:none;display:inline-block}
.sm.d{color:#b3261e}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.sum div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.sum b{display:block;font-size:1.3rem}
.inv input,.inv textarea,.inv select{background:transparent;color:inherit;border:1px solid currentColor;font-family:sans-serif;margin-bottom:10px;opacity:.9}
.pbtn{font:600 .95rem sans-serif;border:0;border-radius:99px;padding:12px 24px;cursor:pointer;margin:4px}
.ws{max-width:480px;width:100%;text-align:left;margin-top:18px}
.ws div{border-top:1px solid currentColor;padding:10px 0;font:.92rem/1.5 sans-serif}
.ws div b{display:block}
.xt{max-width:480px;width:100%}
/* undangan publik */

function makeMusic(style){
  var ac,master,timer,step=0,on=false;
  var chords=[[261.63,329.63,392],[220,261.63,329.63],[174.61,220,261.63],[196,246.94,293.66]];
  var pat=[0,1,2,1,2,1,2,1];
  function note(f,t,d,vol,type){
    var o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'triangle';o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);
  }
  function bar(){
    var t=ac.currentTime+.05,c=chords[step%4];
    if(style==='bugis'){
      var ps=[329.63,392,440,523.25,587.33,659.25];
      var drum=function(tt,f,vol){var o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(f*2,tt);o.frequency.exponentialRampToValueAtTime(f,tt+.12);g.gain.setValueAtTime(vol,tt);g.gain.exponentialRampToValueAtTime(.0001,tt+.4);o.connect(g);g.connect(master);o.start(tt);o.stop(tt+.45)};
      drum(t,90,.32);drum(t+2,90,.28);drum(t+3.25,70,.2);
      [[0,2,1,3,2,4,3,5],[5,3,4,2,3,1,2,0]][step%2].forEach(function(k,i){note(ps[k],t+i*.5,1.1,.12,'triangle');note(ps[k]*2,t+i*.5,.5,.03,'sine')});
      step++;return;
    }
    if(style==='jawa'){
      var f0=220,sc=function(k){return f0*Math.pow(2,k*.2)};
      var bell=function(f,tt){note(f,tt,2.4,.1,'sine');note(f*2.76,tt,.8,.03,'sine')};
      note(f0/2,t,3.8,.2,'sine');note(f0*.75,t,2.4,.05,'sine');
      [[0,2,1,3,2,4,3,2],[4,2,3,1,2,0,1,2]][step%2].forEach(function(k,i){bell(sc(k+5),t+i*.5)});
      step++;return;
    }
    note(c[0]/2,t,3.6,.16);
    pat.forEach(function(i,k){note(c[i]*2,t+k*.5,1.6,.09)});
    if(step%2===1)note(c[2]*4,t+3,1.8,.05);
    step++;
  }
  var api={
    isOn:function(){return on},
    play:function(){
      try{
        if(!ac){
          var AC=window.AudioContext||window.webkitAudioContext;
          ac=new AC();master=ac.createGain();master.gain.value=.8;
          var dl=ac.createDelay(),fb=ac.createGain();dl.delayTime.value=.34;fb.gain.value=.38;
          master.connect(ac.destination);master.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(ac.destination);
        }
        ac.resume();
        if(!timer){bar();timer=setInterval(bar,4000)}
        on=true;
      }catch(e){on=false}
    },
    pause:function(){on=false;if(timer){clearInterval(timer);timer=null}if(ac)ac.suspend()},
    toggle:function(){on?api.pause():api.play()}
  };
  var auto=false;
  document.addEventListener('visibilitychange',function(){
    if(document.hidden&&on){api.pause();auto=true}
    else if(!document.hidden&&auto){auto=false;api.play();var m=document.getElementById('mus');if(m)m.classList.remove('off')}
  });
  return api;
}

async function publicExtras(sb,v,c){
  var code=new URLSearchParams(location.search).get('to'),guest=null;
  if(code){
    var g=await sb.rpc('get_guest',{p_slug:v.slug,p_code:code});
    if(!g.error&&g.data&&g.data.length){guest=g.data[0]}
    else{
      // Bukan kode tamu terdaftar: pakai langsung sebagai nama tamu (?to=Budi+Santoso)
      var nm=code.trim().slice(0,80);
      if(nm){guest={guest_name:nm,guest_pax:5,status:'pending',confirmed_pax:0,byName:true};code=null}
    }
    if(guest){var gh='Kepada Yth.<br><b>'+esc(guest.guest_name)+'</b>';var k=$('kpd');if(k)k.innerHTML=gh;var k2=$('cvg');if(k2)k2.innerHTML=gh}
  }
  var btn='background:'+c.acc+';color:'+c.bg;
  var h='';
  if(guest){
    var st=guest.status==='attending'?'Kamu tercatat hadir ('+guest.confirmed_pax+' orang).':guest.status==='declined'?'Kamu tercatat tidak hadir.':'';
    var opts='';for(var i=1;i<=guest.guest_pax;i++)opts+='<option value="'+i+'">'+i+' orang</option>';
    h+='<h2 class="h">Konfirmasi kehadiran</h2><p class="p" id="rs">'+st+'</p>'+
       (guest.guest_pax>1?'<select id="rp" aria-label="Jumlah orang">'+opts+'</select>':'')+
       '<div><button class="pbtn" id="ry" style="'+btn+'">Saya hadir</button><button class="pbtn" id="rn" style="background:transparent;color:inherit;border:1px solid currentColor">Tidak bisa hadir</button></div>';
  }
  h+='<h2 class="h" style="margin-top:34px">Ucapan dan doa</h2>'+
     '<input id="wn" placeholder="Nama" maxlength="60" value="'+esc(guest?guest.guest_name:'')+'" '+(guest?'readonly':'')+'>'+
     '<textarea id="wm" placeholder="Tulis ucapan" maxlength="500" style="min-height:80px"></textarea>'+
     '<button class="pbtn" id="wk" style="'+btn+'">Kirim ucapan</button><p class="p" id="wmsg" role="status"></p><div class="ws" id="wl"></div>';
  document.querySelector('#extra .xt').innerHTML=h;

  async function loadW(){
    var r=await sb.from('wishes').select('author_name,message,created_at').eq('invitation_id',v.id).eq('is_hidden',false).order('created_at',{ascending:false}).limit(50);
    $('wl').innerHTML=(r.data||[]).map(function(w){return '<div><b>'+esc(w.author_name)+'</b>'+esc(w.message)+'</div>'}).join('');
  }
  async function rsvp(s){
    var p=$('rp')?+$('rp').value:1;
    var r=guest.byName
      ?await sb.rpc('submit_rsvp_name',{p_slug:v.slug,p_name:guest.guest_name,p_status:s,p_pax:p})
      :await sb.rpc('submit_rsvp',{p_slug:v.slug,p_code:code,p_status:s,p_pax:p});
    $('rs').textContent=r.error?'Gagal mengirim. Coba lagi.':(s==='attending'?'Terima kasih, kehadiranmu tercatat.':'Terima kasih sudah memberi tahu.');
  }
  if(guest){$('ry').onclick=function(){rsvp('attending')};$('rn').onclick=function(){rsvp('declined')}}
  $('wk').onclick=async function(){
    var n=$('wn').value.trim(),m=$('wm').value.trim();
    if(!n||!m){$('wmsg').textContent='Isi nama dan ucapan dulu.';return}
    var r=await sb.rpc('submit_wish',{p_slug:v.slug,p_code:code,p_name:n,p_message:m});
    if(r.error){$('wmsg').textContent='Gagal mengirim. Coba lagi.';return}
    $('wm').value='';$('wmsg').textContent='Terima kasih atas ucapannya.';loadW();
  };
  loadW();
}

      '<b style="font-size:.9rem;display:block;margin-top:18px">Resepsi</b><div class="two"><div><label for="rd">Tanggal</label><input id="rd" type="date" value="'+rs.date+'"></div><div><label for="rt">Jam (WIB)</label><input id="rt" type="time" value="'+rs.jam+'"></div></div><label for="rv">Lokasi resepsi</label><input id="rv" value="'+g(ev[1],'venue_name')+'"><label for="mp">Link Google Maps (opsional)</label><input id="mp" value="'+g(ev[1],'map_url')+'">')+
    acc('Template dan tampilan','Pilih gaya undangan',true,
      '<label>Pilih template</label><div class="tpl" id="sw">'+tplCards(palette)+'</div><p class="msg"><a id="pvl" target="_blank" rel="noopener" href="?demo='+palette+'">Lihat contoh template ini</a> · <a href="?katalog=1" target="_blank" rel="noopener">Semua template</a></p>'+
      '<label for="qt">Kutipan</label><textarea id="qt">'+g(inv,'quote')+'</textarea>')+
    acc('Tambahan','Kisah, dresscode, dan amplop digital (opsional)',false,
      '<label for="st">Kisah singkat kalian</label><textarea id="st" style="min-height:110px">'+esc(cf0.story||'')+'</textarea>'+
      '<label for="dc">Dresscode</label><input id="dc" value="'+esc(cf0.dresscode||'')+'">'+
      '<label for="bk">Bank atau e-wallet</label><input id="bk" value="'+esc(cf0.bank||'')+'">'+
      '<div class="two"><div><label for="an">Nomor rekening</label><input id="an" inputmode="numeric" value="'+esc(cf0.acc_no||'')+'"></div><div><label for="ah">Atas nama</label><input id="ah" value="'+esc(cf0.acc_name||'')+'"></div></div>')+
    acc('Alamat undangan','Bagian akhir link undanganmu',false,
      '<label for="sl">Slug</label><input id="sl" value="'+g(inv,'slug')+'" autocapitalize="none" spellcheck="false"><p class="msg">Huruf kecil, angka, dan tanda hubung. Contoh: raka-anindya</p>')+
    '</section>'+
    '<section id="tab-guest" class="hide"><div class="panel" id="guestPanel"></div></section>'+
    '<section id="tab-wish" class="hide"><div class="panel" id="wishPanel"></div></section>'+
    '<p class="msg vtag">Versi 5.0</p></main>'+
    '<div class="savebar" id="savebar"><button class="btn" id="sv">Simpan</button><button class="btn o" id="pb">'+(inv&&inv.status==='active'?'Nonaktifkan':'Aktifkan undangan')+'</button><span class="msg" id="msg" role="status"></span></div>';
    showLink();guestsPanel();
    $('out').onclick=async function(){await sb.auth.signOut();history.replaceState(null,'',location.pathname);landingView()};
    $('sw').onclick=function(e){var b=e.target.closest('button');if(!b)return;palette=b.dataset.t;
      document.querySelectorAll('#sw button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});$('pvl').href='?demo='+palette};
    $('tabs').onclick=function(e){var b=e.target.closest('button');if(!b)return;
      ['edit','guest','wish'].forEach(function(t){$('tab-'+t).classList.toggle('hide',t!==b.dataset.tab)});
      document.querySelectorAll('#tabs button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});
      $('savebar').classList.toggle('hide',b.dataset.tab!=='edit');window.scrollTo(0,0)};
    $('sv').onclick=save;$('pb').onclick=toggle;
  }
  function showLink(){
    var st=$('lstat'),l=$('lk'),a=$('lact');if(!st)return;
    if(!inv){st.innerHTML='<span class="bd off">Belum dibuat</span>Isi data di bawah, lalu ketuk Simpan.';l.textContent='';a.innerHTML='';return}
    var u=location.origin+location.pathname+'?u='+inv.slug,on=inv.status==='active';
    st.innerHTML='<span class="bd '+(on?'on':'off')+'">'+(on?'Aktif':'Draf')+'</span>'+(on?'Undanganmu sudah bisa dibuka tamu.':'Belum aktif. Ketuk Aktifkan setelah datanya lengkap.');
    l.textContent=u;
    a.innerHTML='<button class="sm" id="lcp" type="button">Salin link</button><a class="sm" target="_blank" rel="noopener" href="'+esc(u)+'">Buka</a><a class="sm" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent('Undangan pernikahan '+inv.groom_name+' & '+inv.bride_name+': '+u)+'">Bagikan WA</a>';
    $('lcp').onclick=async function(){try{await navigator.clipboard.writeText(u);$('lcp').textContent='Tersalin'}catch(x){window.prompt('Salin link ini:',u)}};
  }
  function iso(d,t){return d&&t?d+'T'+t+':00+07:00':null}
  async function save(){
    var v=function(i){return $(i).value.trim()};
    if(!v('gn')||!v('bn')){say('Isi nama kedua mempelai.');return}
    var slug=slugify(v('sl')||v('gn')+' '+v('bn'));
    if(slug.length<3){say('Slug minimal 3 huruf atau angka.');return}
    var a=iso(v('ad'),v('at')),b=iso(v('rd'),v('rt'));
    if(!a){say('Isi tanggal dan jam akad.');return}
    say('Menyimpan...');
    var row={owner_id:user.id,theme_id:(themeMap[palette]||themeId),slug:slug,groom_name:v('gn'),bride_name:v('bn'),groom_parents:v('gp'),bride_parents:v('bp'),quote:v('qt'),theme_config:{palette:palette,story:v('st'),dresscode:v('dc'),bank:v('bk'),acc_no:v('an'),acc_name:v('ah')}};
    var r=inv?await sb.from('invitations').update(row).eq('id',inv.id).select().single():await sb.from('invitations').insert(row).select().single();
    if(r.error){say(r.error.code==='23505'?'Slug sudah dipakai, coba yang lain.':'Gagal menyimpan: '+r.error.message);return}
    inv=r.data;
    await sb.from('events').delete().eq('invitation_id',inv.id);
    var evs=[{invitation_id:inv.id,name:'Akad nikah',starts_at:a,venue_name:v('av'),sort_order:0}];
    if(b)evs.push({invitation_id:inv.id,name:'Resepsi',starts_at:b,venue_name:v('rv'),map_url:v('mp')||null,sort_order:1});
    var e=await sb.from('events').insert(evs);
    $('sl').value=slug;showLink();guestsPanel();
    say(e.error?'Data acara gagal disimpan: '+e.error.message:'Tersimpan.');
  }
  async function toggle(){
    if(!inv){say('Simpan dulu sebelum mengaktifkan.');return}
    var on=inv.status!=='active';
    var r=await sb.from('invitations').update({status:on?'active':'draft',published_at:on?new Date().toISOString():inv.published_at}).eq('id',inv.id).select().single();
    if(r.error){say('Gagal: '+r.error.message);return}
    inv=r.data;$('pb').textContent=on?'Nonaktifkan':'Aktifkan undangan';showLink();say(on?'Undangan aktif.':'Undangan dinonaktifkan.');
  }
  function base(){return location.origin+location.pathname}
  function phone62(p){p=String(p||'').replace(/[^0-9]/g,'');if(p.indexOf('0')===0)p='62'+p.slice(1);return p}
  function guestLink(g){return base()+'?u='+inv.slug+'&to='+g.code}
  function waText(g){return 'Assalamualaikum, '+g.name+'. Kami mengundang Anda ke pernikahan '+inv.groom_name+' & '+inv.bride_name+'. Buka undangan di sini: '+guestLink(g)}

  async function guestsPanel(){
    var gp=$('guestPanel'),wp=$('wishPanel');if(!gp)return;
    if(!inv){gp.innerHTML='<p class="msg">Simpan undangan di tab Undangan dulu. Setelah itu kamu bisa membuat link tamu di sini.</p>';wp.innerHTML='<p class="msg">Ucapan dari tamu akan tampil di sini.</p>';return}
    gp.innerHTML='<h1 style="font-size:1.3rem">Link per nama tamu</h1><p class="msg">Tidak perlu mendaftarkan tamu dulu. Ketik nama, lalu salin atau kirim linknya. Nama otomatis tampil di undangan.</p>'+
      '<label for="qn">Nama tamu</label><input id="qn" placeholder="Budi Santoso" maxlength="80">'+
      '<div class="row"><button class="btn" id="qc">Salin link</button><button class="btn o" id="qw">Kirim lewat WA</button></div>'+
      '<p class="link" id="ql"></p>'+
      '<hr style="border:0;border-top:1px solid var(--line);margin:22px 0">'+
      '<h1 style="font-size:1.3rem">Daftar tamu (opsional)</h1><p class="msg">Satu tamu per baris. Format: <b>Nama, nomor WhatsApp</b> (nomor boleh dikosongkan).</p>'+
      '<textarea id="gl" placeholder="Budi Santoso, 081234567890&#10;Keluarga Ibu Rini"></textarea>'+
      '<label for="gx">Jumlah orang per tamu</label><input id="gx" type="number" min="1" max="10" value="1">'+
      '<div class="row"><button class="btn" id="ga">Tambah tamu</button></div><p class="msg" id="gm" role="status"></p>'+
      '<div class="sum" id="gs"></div><div id="gr"></div>';
    $('ga').onclick=addGuests;
    function nameLink(){var n=$('qn').value.trim();return n?base()+'?u='+inv.slug+'&to='+encodeURIComponent(n):''}
    $('qn').oninput=function(){var u=nameLink();$('ql').textContent=u};
    $('qc').onclick=async function(){
      var u=nameLink();if(!u){$('ql').textContent='Ketik nama tamu dulu.';return}
      $('ql').textContent=u;
      try{await navigator.clipboard.writeText(u);$('qc').textContent='Tersalin'}catch(x){window.prompt('Salin link ini:',u)}
      setTimeout(function(){$('qc').textContent='Salin link'},2000);
    };
    $('qw').onclick=function(){
      var u=nameLink(),n=$('qn').value.trim();if(!u){$('ql').textContent='Ketik nama tamu dulu.';return}
      var t='Assalamualaikum, '+n+'. Kami mengundang Anda ke pernikahan '+inv.groom_name+' & '+inv.bride_name+'. Buka undangan di sini: '+u;
      window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank','noopener');
    };
    await loadGuests();loadWishes();
  }
  async function addGuests(){
    var lines=$('gl').value.split('\n').map(function(x){return x.trim()}).filter(Boolean);
    if(!lines.length){$('gm').textContent='Isi minimal satu nama.';return}
    var pax=Math.max(1,Math.min(10,+$('gx').value||1));
    var rows=lines.map(function(l){var p=l.split(',');return {invitation_id:inv.id,name:p[0].trim().slice(0,80),phone:(p[1]||'').trim()||null,pax:pax}}).filter(function(r){return r.name});
    var r=await sb.from('guests').insert(rows);
    if(r.error){$('gm').textContent='Gagal menambah: '+r.error.message;return}
    $('gl').value='';$('gm').textContent=rows.length+' tamu ditambahkan.';loadGuests();
  }
  async function loadGuests(){
    var r=await sb.from('guests').select('*').eq('invitation_id',inv.id).order('created_at');
    var gs=r.data||[],hadir=0,tidak=0,belum=0;
    gs.forEach(function(g){if(g.rsvp_status==='attending')hadir+=g.rsvp_pax||0;else if(g.rsvp_status==='declined')tidak++;else belum++});
    $('gs').innerHTML='<div><b>'+hadir+'</b>orang hadir</div><div><b>'+tidak+'</b>tidak hadir</div><div><b>'+belum+'</b>belum jawab</div>';
    $('gr').innerHTML=gs.length?gs.map(function(g){
      var s=g.rsvp_status==='attending'?'Hadir':g.rsvp_status==='declined'?'Tidak hadir':'Belum jawab';
      var wa=g.phone?'<a class="sm" target="_blank" rel="noopener" href="https://wa.me/'+phone62(g.phone)+'?text='+encodeURIComponent(waText(g))+'">Kirim WA</a> ':'';
      return '<div class="gr"><b>'+esc(g.name)+'<span class="bd">'+s+'</span></b><small>'+g.pax+' orang'+(g.opened_at?' · sudah dibuka':'')+'</small><div class="row">'+wa+
        '<button class="sm" data-c="'+esc(g.code)+'" data-a="copy">Salin link</button><button class="sm d" data-i="'+g.id+'" data-a="del">Hapus</button></div></div>'}).join('')
      :'<p class="msg">Belum ada tamu.</p>';
    $('gr').onclick=async function(e){
      var b=e.target.closest('button');if(!b)return;
      if(b.dataset.a==='copy'){
        var u=base()+'?u='+inv.slug+'&to='+b.dataset.c;
        try{await navigator.clipboard.writeText(u);b.textContent='Tersalin'}catch(x){window.prompt('Salin link ini:',u)}
      }else if(b.dataset.a==='del'&&confirm('Hapus tamu ini?')){
        await sb.from('guests').delete().eq('id',b.dataset.i);loadGuests();
      }
    };
  }
  async function loadWishes(){
    var wp=$('wishPanel');
    var r=await sb.from('wishes').select('*').eq('invitation_id',inv.id).order('created_at',{ascending:false});
    var ws=r.data||[];
    wp.innerHTML='<h1 style="font-size:1.3rem">Ucapan tamu ('+ws.length+')</h1>'+(ws.length?ws.map(function(w){
      return '<div class="gr"><b>'+esc(w.author_name)+(w.is_hidden?'<span class="bd">Disembunyikan</span>':'')+'</b><small>'+esc(w.message)+'</small><div class="row"><button class="sm" data-i="'+w.id+'" data-h="'+(w.is_hidden?'0':'1')+'">'+(w.is_hidden?'Tampilkan':'Sembunyikan')+'</button></div></div>'}).join(''):'<p class="msg">Belum ada ucapan.</p>');
    wp.onclick=async function(e){
      var b=e.target.closest('button');if(!b)return;
      await sb.from('wishes').update({is_hidden:b.dataset.h==='1'}).eq('id',b.dataset.i);loadWishes();
    };
  }
  init();
}
</script>
</body>
</html>
